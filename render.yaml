services:
  - type: web
    name: ai-powered-msme-credit-assessment
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    autoDeploy: true
    disk:
      name: msme-financial-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MSME_DATABASE_PATH
        value: /var/data/emi_planner.db
      - key: GROQ_API_KEY
        sync: false
