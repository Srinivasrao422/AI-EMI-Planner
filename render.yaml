services:
  - type: web
    name: ai-powered-msme-credit-assessment
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
