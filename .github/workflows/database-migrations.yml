name: Database and business profile tests

on:
  push:
    branches:
      - "v2/**"
  pull_request:
    branches:
      - main

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run database and business profile regression tests
        run: |
          python -m unittest -v test_database_migrations test_business_profiles
