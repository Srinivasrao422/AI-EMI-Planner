name: Database and MSME financial tests

on:
  push:
    branches:
      - "v2/**"
  pull_request:
    branches:
      - main

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pandas pypdf python-dotenv groq reportlab
      - name: Run database and MSME regression tests
        run: |
          python -m unittest -v test_database_migrations test_business_profiles test_financial_records test_financial_health test_resilience_twin test_cash_flow test_loan_optimizer test_bank_statement test_cash_flow_intelligence test_cash_flow_outlook test_ai_grounding test_msme_credit_assessment test_credit_readiness_report test_financial_intelligence
