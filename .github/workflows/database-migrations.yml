name: Database migration tests

on:
  push:
    branches:
      - "v2/**"
  pull_request:
    branches:
      - main

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run database migration regression tests
        run: python -m unittest -v test_database_migrations
